services:
  - type: web
    name: boxfit-backend
    env: docker
    rootDir: boxfit-backend
    plan: free
    autoDeploy: true
    envVars:
      - key: MONGO_URI
        sync: false     # set in Render dashboard
      - key: MONGO_DB_NAME
        value: BoxFit
      - key: CORS_ORIGIN
        value: http://localhost:5173
